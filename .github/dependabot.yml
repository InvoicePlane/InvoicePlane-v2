version: 2
updates:
  # Composer - PHP dependencies
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "composer"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "nielsdrost7"
    # Group updates by dependency type
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security"
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Yarn - JavaScript dependencies (uses npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "yarn"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "nielsdrost7"
    # Group updates by dependency type
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security"
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "11:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "nielsdrost7"
