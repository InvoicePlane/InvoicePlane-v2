name: Build Production Release

on:
  push:
    branches:
      - master

env:
  RELEASE_TYPE: 'alpha'  # Options: alpha, beta, stable

jobs:
  build-release:
    name: Build and Package Production Release
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required for creating releases and tags
      actions: write   # Required for uploading artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Fetch only last commit for faster checkout
          fetch-tags: true  # Fetch tags for versioning

      # Step 1: Download translations from Crowdin
      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          download_translations: true
          localization_branch_name: master
          create_pull_request: false
          crowdin_branch_name: master
          config: 'crowdin.yml'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # Step 2: Validate translations
      - name: Validate translations directory
        run: |
          echo "Validating translations structure..."
          if [ ! -d "resources/lang/en" ]; then
            echo "ERROR: Missing required language directory: resources/lang/en"
            exit 1
          fi
          echo "✓ Translations structure validated"

      # Step 3: Set up Node.js for frontend build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install frontend dependencies (production mode)
        run: |
          echo "Installing frontend dependencies..."
          yarn install --frozen-lockfile --production=false
          echo "✓ Frontend dependencies installed"

      - name: Build frontend assets for production
        run: |
          echo "Building frontend assets..."
          yarn build
          echo "✓ Frontend assets built successfully"

      # Step 4: Set up PHP and Composer
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, bcmath, dom, intl, xml, zip, mbstring, pdo_mysql
          coverage: none

      - name: Display tool versions
        run: |
          echo "========================================="
          echo "Tool Versions"
          echo "========================================="
          echo "PHP version: $(php -v | head -n 1)"
          echo "Composer version: $(composer --version)"
          echo "Node.js version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "Yarn version: $(yarn -v)"
          echo "========================================="

      - name: Install Composer dependencies (production)
        run: |
          echo "Installing Composer dependencies (production mode)..."
          composer install --no-dev --optimize-autoloader \
            --no-interaction --prefer-dist
          echo "✓ Composer dependencies installed"

      - name: Install vendor cleaner and optimize
        run: |
          echo "Installing composer-vendor-cleaner..."
          composer require liborm85/composer-vendor-cleaner --dev \
            --no-interaction --no-update
          composer update liborm85/composer-vendor-cleaner --no-interaction
          echo "Running vendor cleanup..."
          composer vendor-cleaner
          echo "✓ Vendor directory optimized"

      # Step 5: Cleanup workspace
      - name: Clean workspace
        run: |
          echo "========================================="
          echo "Cleaning Workspace"
          echo "========================================="
          
          echo "Removing npm dependencies (node_modules)..."
          rm -rf node_modules
          
          echo "Removing .DS_Store files..."
          find . -type f -name '.DS_Store' -delete
          
          echo "Cleaning mPDF fonts (keeping only DejaVu)..."
          find vendor/mpdf/mpdf/ttfonts -type f ! -name "DejaVu*" \
            -delete 2>/dev/null || true
          
          echo "Cleaning mPDF QR code data..."
          rm -rf vendor/mpdf/mpdf/src/QrCode/data/* 2>/dev/null || true
          
          echo "Removing .git directories from vendor..."
          find vendor -name '.git' -type d -exec rm -rf {} + 2>/dev/null || true
          
          echo "Removing .github directories..."
          rm -rf .github
          
          echo "✓ Workspace cleaned successfully"
          echo "========================================="

      # Step 6: Create release archive
      - name: Package InvoicePlane
        run: |
          echo "========================================="
          echo "Creating Release Package"
          echo "========================================="
          
          # Create a timestamp for the release
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          RELEASE_NAME="invoiceplane-v2-${TIMESTAMP}"
          RELEASE_FILE="${RELEASE_NAME}.zip"

          echo "Package name: ${RELEASE_FILE}"
          
          # Create zip excluding unnecessary files
          echo "Creating ZIP archive (this may take a moment)..."
          zip -q -r -9 "${RELEASE_FILE}" . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x ".env*" \
            -x "*.sqlite" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*" \
            -x ".phpunit*" \
            -x "phpunit.xml" \
            -x "phpstan.neon" \
            -x "phpstan-baseline.neon" \
            -x "pint.json" \
            -x "rector.php" \
            -x ".editorconfig" \
            -x ".prettierrc" \
            -x "docker-compose.yml" \
            -x "yarn.lock" \
            -x "package.json" \
            -x "vite.config.js" \
            -x "tailwind.config.js" \
            -x ".DS_Store"

          echo "✓ Package created successfully"
          
          echo "Generating checksums..."
          sha256sum "${RELEASE_FILE}" > sha256.txt
          md5sum "${RELEASE_FILE}" > md5.txt
          
          echo "SHA256: $(cat sha256.txt)"
          echo "MD5: $(cat md5.txt)"
          echo "✓ Checksums generated"
          
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_FILE=${RELEASE_FILE}" >> $GITHUB_ENV
          
          echo "========================================="
          echo "Package Details"
          echo "========================================="
          ls -lh "${RELEASE_FILE}"
          echo "========================================="

      # Step 7: Generate version tag and release notes
      - name: Generate version tag and release notes
        id: version
        run: |
          echo "========================================="
          echo "Generating Version Tag"
          echo "========================================="
          
          # Get the latest tag or start with v0.0.0
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Previous tag: ${PREVIOUS_TAG}"
          
          # Extract version numbers
          VERSION=${PREVIOUS_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Increment version based on release type
          case "${{ env.RELEASE_TYPE }}" in
            alpha)
              PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-alpha"
              ;;
            beta)
              PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-beta"
              ;;
            stable)
              MINOR=$((MINOR + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.0"
              ;;
            *)
              echo "ERROR: Invalid RELEASE_TYPE: ${{ env.RELEASE_TYPE }}"
              exit 1
              ;;
          esac
          
          NEW_TAG="v${NEW_VERSION}"
          echo "New tag: ${NEW_TAG}"
          
          # Store for later steps
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> $GITHUB_ENV
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          
          echo "✓ Version tag generated"
          echo "========================================="
          
          # Generate release notes between tags
          echo "Generating release notes..."
          echo "# Release ${NEW_TAG}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Release Type:** ${{ env.RELEASE_TYPE }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          
          if [ "$PREVIOUS_TAG" = "v0.0.0" ]; then
            echo "## Initial Release" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "This is the first release of InvoicePlane v2." >> RELEASE_NOTES.md
          else
            echo "## Changes since ${PREVIOUS_TAG}" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            
            # Fetch previous tag for comparison
            git fetch --depth=1 origin tag ${PREVIOUS_TAG} 2>/dev/null || true
            
            # Generate changelog
            git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md 2>/dev/null || \
              echo "- Initial release" >> RELEASE_NOTES.md
          fi
          
          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> RELEASE_NOTES.md
          
          echo "✓ Release notes generated"
          cat RELEASE_NOTES.md

      # Step 8: Upload release artifact
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: |
            ${{ env.RELEASE_FILE }}
            sha256.txt
            md5.txt
            RELEASE_NOTES.md
          retention-days: 90

      # Step 9: Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.RELEASE_FILE }}
            sha256.txt
            md5.txt
          draft: false
          prerelease: ${{ env.RELEASE_TYPE != 'stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 10: Workflow complete
      - name: Workflow summary
        run: |
          echo "========================================="
          echo "INVOICEPLANE V2 WORKFLOW COMPLETED"
          echo "========================================="
          echo "Release: ${{ env.NEW_TAG }}"
          echo "Type: ${{ env.RELEASE_TYPE }}"
          echo "Package: ${{ env.RELEASE_FILE }}"
          echo "Artifact name: ${{ env.RELEASE_NAME }}"
          echo "Checksums: sha256.txt, md5.txt"
          echo "Release notes: RELEASE_NOTES.md"
          echo "========================================="
          echo "GitHub Release created successfully!"
          echo "========================================="
