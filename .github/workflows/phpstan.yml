name: PHPStan Analysis

on:
  workflow_dispatch:  # Manual only — does not run automatically

jobs:
  phpstan:
    name: Static Analysis with PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer
          extensions: json

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan (JSON output)
        run: |
          vendor/bin/phpstan analyse --memory-limit=1G --error-format=json > phpstan.json || true
          cat phpstan.json

      - name: Parse and format PHPStan results
        run: |
          php .github/scripts/parse-phpstan-results.php phpstan.json > phpstan-report.md

      - name: Display formatted report
        run: cat phpstan-report.md

      - name: Upload PHPStan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpstan-results
          path: |
            phpstan.json
            phpstan-report.md

      - name: Comment on PR (if available)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('phpstan-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
