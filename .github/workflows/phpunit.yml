name: Run PHPUnit Tests

permissions:
  contents: read

on:
  workflow_dispatch:  # Manual only — does not run automatically

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP with Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          php-extensions: 'mbstring, bcmath, pdo_mysql'
          composer-flags: '--no-progress --prefer-dist --optimize-autoloader'

      - name: Prepare Laravel environment
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing

      #- name: Run Laravel migrations
      #  run: php artisan migrate --force --env=testing

      #- name: Run Laravel seeds (optional)
      #  run: php artisan db:seed --force --env=testing

      - name: Run PHPUnit
        run: php artisan test --env=testing
